services:
  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - microservices

  consul-init:
    image: hashicorp/consul:1.20
    container_name: consul-init
    command:
      - sh
      - -c
      - |
        until consul kv put config/hazelcast/cluster_name dev; do sleep 1; done
        consul kv put config/hazelcast/members hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
        consul kv put config/hazelcast/map_name transactions
        consul kv put config/mq/hazelcast_members hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
        consul kv put config/mq/queue_name counter-transactions
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
    depends_on:
      - consul
    networks:
      - microservices

  hazelcast-1:
    image: hazelcast/hazelcast:5.3.7
    container_name: hazelcast-1
    hostname: hazelcast-1
    environment:
      - HZ_CLUSTERNAME=dev
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config_ext/hazelcast.yaml
    command: ["/opt/hazelcast/bin/hz-start", "-c", "/opt/hazelcast/config_ext/hazelcast.yaml"]
    ports:
      - "5701:5701"
    networks:
      - microservices

  hazelcast-2:
    image: hazelcast/hazelcast:5.3.7
    container_name: hazelcast-2
    hostname: hazelcast-2
    environment:
      - HZ_CLUSTERNAME=dev
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config_ext/hazelcast.yaml
    command: ["/opt/hazelcast/bin/hz-start", "-c", "/opt/hazelcast/config_ext/hazelcast.yaml"]
    networks:
      - microservices

  hazelcast-3:
    image: hazelcast/hazelcast:5.3.7
    container_name: hazelcast-3
    hostname: hazelcast-3
    environment:
      - HZ_CLUSTERNAME=dev
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config_ext/hazelcast.yaml
    command: ["/opt/hazelcast/bin/hz-start", "-c", "/opt/hazelcast/config_ext/hazelcast.yaml"]
    networks:
      - microservices

  logging-service-1:
    build: .
    command: python logging_service/main.py
    container_name: logging-service-1
    ports:
      - "50051:50051"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CONSUL_URL=http://consul:8500
      - INSTANCE_ID=logging-service-1
      - SERVICE_ID=logging-service-1
      - SERVICE_ADDRESS=logging-service-1
      - SERVICE_PORT=50051
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices

  logging-service-2:
    build: .
    command: python logging_service/main.py
    container_name: logging-service-2
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CONSUL_URL=http://consul:8500
      - INSTANCE_ID=logging-service-2
      - SERVICE_ID=logging-service-2
      - SERVICE_ADDRESS=logging-service-2
      - SERVICE_PORT=50051
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices

  logging-service-3:
    build: .
    command: python logging_service/main.py
    container_name: logging-service-3
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CONSUL_URL=http://consul:8500
      - INSTANCE_ID=logging-service-3
      - SERVICE_ID=logging-service-3
      - SERVICE_ADDRESS=logging-service-3
      - SERVICE_PORT=50051
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
    networks:
      - microservices

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_DB=transactions
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - microservices

  counter-service:
    build: .
    command: uvicorn messages_service.main:app --host 0.0.0.0 --port 8002
    container_name: counter-service
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CONSUL_URL=http://consul:8500
      - SERVICE_NAME=counter-service
      - SERVICE_ID=counter-service
      - SERVICE_ADDRESS=counter-service
      - SERVICE_PORT=8002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transactions
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - microservices

  facade-service:
    build: .
    command: uvicorn facade_service.main:app --host 0.0.0.0 --port 8000
    container_name: facade-service
    ports:
      - "8000:8000"
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started
      counter-service:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CONSUL_URL=http://consul:8500
      - SERVICE_NAME=facade-service
      - SERVICE_ID=facade-service
      - SERVICE_ADDRESS=facade-service
      - SERVICE_PORT=8000
    networks:
      - microservices

networks:
  microservices:
    driver: bridge

volumes:
  postgres-data:
